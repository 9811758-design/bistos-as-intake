[project]
name = "service-validation-generator"
version = "1.0.0"
description = "Exported Excel service validation workbook generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth[requests]>=2.40",
    "google-auth-oauthlib>=1.2.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.11",
    "pypdf>=6.0",
    "pywin32>=311",
    "xlrd>=2.0.2",
]

[project.scripts]
service-validation = "service_validation.main:main"
service-validation-pdf = "service_validation.pdf_main:main"
receivables-reconciliation = "receivables_reconciliation.main:main"
as-intake = "as_intake.main:main"

[dependency-groups]
dev = ["basedpyright>=1.31", "pyinstaller>=6.14", "pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_validation", "src/receivables_reconciliation", "src/as_intake"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["build", "dist"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
